# S2 — Blueprint §3. AMBER — 'collapse gracefully' has a visual tail; held at branch.
id: docking-minimums
goal: "Halve stacked min-heights so the panel is usable at its declared PANEL_MIN_HEIGHT=400; faces collapse gracefully"
model: opusplan
autonomy: amber
owns:
  - "python/synapse/panel/synapse_panel.py"
  - "python/synapse/panel/face_work.py"
  - "python/synapse/panel/face_review.py"
  - "python/synapse/panel/designsystem/components.py"
do_not_touch:
  - "python/synapse/panel/claude_worker.py"     # §1 FLOOR
  - "python/synapse/cognitive/**"
features:
  # PySide-bound goalpost runs under hython via .synapse/hytest.py: stock
  # `pytest -q` SKIPs it (no PySide) and a skip exits 0, which the harness reads
  # as PASSING -- a false green. The shim finds a hython with pytest+PySide (or
  # honours $SYNAPSE_HYTHON), so it survives Houdini upgrades.
  - description: "Panel lays out without overflow at 400px tall"
    verify: "python .synapse/hytest.py tests/panel/test_docking.py::test_usable_at_min_height"
    passing: false
  - description: "No child sets a hard minimum height above 200px"
    verify: "python .synapse/verify.py max-min-height python/synapse/panel 200"
    passing: false
  - description: "Suite still green"
    verify: "pytest -q"
    passing: false
  # Landing r3 (CTO RULING-2A, 2026-09-05). The width CONTRACT is
  # tokens.PANEL_MIN_WIDTH = 280 (what synapse_panel.py promises the host).
  # The PD wave's 380 is an INTERIM bound, written here so the docking test
  # reads it like it reads the heights - never a literal in the test. No
  # width counts unless the bundled fonts are loaded: the worker refuses an
  # empty font database (NOT_RUN -> pytest.fail, never skip) and prints the
  # runner and the resolved family into every PD_QT receipt line.
  # One width per density (landing r3 repair, R3-01): the composed panel at
  # AIRY measures 393 (verb rail 237 + four group gaps at 24 + the 30px
  # gutter both sides) against this 380. That figure is Joe's word, not the
  # forge's - option (a) is editing the airy figure below; (b) a tighter
  # verb-rail role at airy; (c) a narrower GUTTER (26 still gives 385). The
  # test reads each density's figure from this line, so the word is one edit.
  # CTO RULING R3-01 (2026-09-05, under Joe's delegation; harness/cto/runs/2026-09-05/RULING_R3-01_docking_airy.md):
  # airy is wider by design - the figure is 400, standard/tight stay 380. Interim toward the 280 contract;
  # the real fix (a verb rail that collapses to icons below ~360px) is queued for the next design wave.
  # The wordmark never elides (ff678887): the brand is the last thing that gives way.
  - description: "Every docking region minimumSizeHint().width() <= 400px wide at airy, <= 380px wide at standard, <= 380px wide at tight, with bundled fonts loaded (interim PD bound; contract floor is PANEL_MIN_WIDTH 280)"
    verify: "\"C:/Program Files/Side Effects Software/Houdini 22.0.400/python313/python.exe\" -m pytest tests/test_panel_rhythm_docking.py -q -p no:cacheprovider"
    passing: false
stop_when: "all features passing OR sessions exhausted OR budget reached"
