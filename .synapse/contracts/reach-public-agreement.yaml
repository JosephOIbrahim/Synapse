# REACH-PUBLIC-AGREEMENT — Blueprint sec.4 R2 + sec.7. GREEN tier — pure git/file reads, no Houdini.
# Executed as reach leg P1-R2 (worktree reach/p1-r2).
id: reach-public-agreement
goal: "The public face may never trail a published release. The README's claimed version must equal the newest release tag (`git tag --list` vX.Y.Z max) AND the canonical VERSION file, or the verifier exits red. Release-window asymmetry is deliberate: the public face AHEAD of the newest tag stays green (bump lands, README syncs, tag is pushed after — every correct release passes through that window); a tag AHEAD of the public face is red (a release was published without updating the public artifact). A present-but-stale 'tags: vX.Y.Z is latest' claim in the README is drift and is red; absence of the claim is allowed. Git or tags unavailable is UNKNOWN -> 'nothing to compare', never a fabricated red and never a fabricated green. The changelog is not new work: it falls out of the existing bump/verify/tag ritual for free — the bump edits the in-tree chain, this gate verifies it, the tag publishes it."
model: opus
autonomy: green
owns:
  - "harness/verify/version_agreement.py"   # public_agreement() + readme_banner ROOT_FILE, additive
  - ".synapse/contracts/reach-public-agreement.yaml"
  - "tests/test_reach_public_agreement.py"
do_not_touch:
  - "python/synapse/**"
  - "VERSION"                               # bump is a Joe word
  - "README.md"                             # public-face content edits are Joe words; the gate only READS it
features:
  - description: "ROOT_FILES gains readme_banner anchored to the '<sub>vX.Y.Z · Houdini' banner so a historical version in the body cannot satisfy it; the in-tree chain (VERSION == __version__ == pyproject == docstring == claude_md == readme_banner) is one agree= verdict"
    verify: "python harness/verify/version_agreement.py prints the six-way chain and readme_banner=5.52.0 agree=True"
    passing: false
  - description: "public_agreement verdict gates the exit: banner != VERSION red; newest release tag > banner red ('public face stale'); absent banner red; banner ahead of tags green (release window); git/tags unavailable green-with-'nothing to compare'"
    verify: "tests/test_reach_public_agreement.py — injected-tags unit tests cover every arm"
    passing: false
  - description: "--fix heals ONLY a stale 'tags: vX is latest' claim forward to canonical; a claim AHEAD of canonical stays red for human eyes (fixing it down would mask the anomaly)"
    verify: "tests/test_reach_public_agreement.py::test_fix_heals_stale_claim_only"
    passing: false
  - description: "live run on master checkout: banner == VERSION == newest tag (5.52.0), and the stale 'tags: v5.50.0 is latest' claim surfaces RED with evidence — the exact drift shape this contract exists to catch"
    verify: "paste of real `python harness/verify/version_agreement.py` output in the leg receipt harness/reach/bus/reach_p1_r2.json"
    passing: false
stop_when: "all features passing OR sessions exhausted OR budget reached"
