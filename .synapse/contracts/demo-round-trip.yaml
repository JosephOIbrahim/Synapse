# DEMO-ROUND-TRIP — docs/BATTLEPLAN.md §4/§5. Authored 2026-08-31 (CTO pass, Fable 5).
# Ratification: RATIFIED — Joe word, 2026-08-31. This ratifies the Tue 18:00 BRANCH PREDICATE ONLY,
# NOT the result: all features remain passing:false and unmeasured until footage exists. No agent may
# ever flip them. Ratifying arms the decision rule below; it makes no claim the round-trip works.
# Autonomy RED: human hands at the rig, in the Houdini 22.0.400 GUI. Never simulatable, never
# agent-completable — the same class as W5-UNDO-GUI. No agent may mark any feature here passing.
# Stop window: 7 days. Branch point 2026-10-07 (the recording); deadline 2026-10-14 to bank two
# receipted takes that HIT under the three-part pass test below.
# AMENDED 2026-10-07 — Jev rulings, cto-postdemo ledger (source: CONTRACT_PROPOSAL.md, DEMO-04):
#   * HIT is the three-part pass test: found=true AND matches[0].id == the take's synapse_decide
#     deposit id AND no match with source=knowledge. scope=project on BOTH calls. payload.hit is
#     dropped: the recall result is {query, found, count, matches[]} and has no such field (adopt p0.83).
#   * The Gate 0 GUI half and the Ctrl+Z receipt moved to demo-gate0-gui.yaml, so a memory take is
#     judged on memory alone (split p0.98).
# AMENDED 2026-10-08 — Joe ruling 05:59 (owner decision, not Jev): the stop window is 7 days, with
#   the 2026-10-07 recording as the branch point and 2026-10-14 as the deadline for banking two
#   receipted takes under the three-part pass test. It replaces the past September stop dates.
id: demo-round-trip
goal: "In the live Houdini GUI, on camera: deposit a memory (synapse_decide, scope=project), close the scene, reopen it, recall the memory (synapse_recall, scope=project) — and the recall is a HIT: found=true AND matches[0].id == the deposit id AND no match with source=knowledge. Repeat 2, both HIT. Footage is the receipt."
model: opus
autonomy: red              # Joe's hands only; agents record UNKNOWN for every feature here
owns:
  - "harness/battleplan/runs/<date>/demo_round_trip_<take>.json"  # per take: build, deposit_id, full recall result, recall scope, HIT/no-HIT, footage path
  - ".synapse/contracts/demo-round-trip.yaml"
do_not_touch:
  - "python/**"                                    # this contract changes no code
  - "VERSION"
features:
  - description: "round-trip take 1: deposit (synapse_decide, scope=project, recorded=true) -> save -> File > New -> File > Open the same hip -> recall (synapse_recall, scope=project) returns found=true, matches[0].id == the deposit id, and no source=knowledge match; on screen recording"
    verify: "demo_round_trip_1.json carries deposit_id, the full recall result, the recall scope, and the footage path"
    passing: false
  - description: "round-trip take 2: same sequence, same result (repeat-2 discipline)"
    verify: "demo_round_trip_2.json carries deposit_id, the full recall result, the recall scope, and the footage path"
    passing: false
stop_when: "both takes HIT under the three-part pass test by 2026-10-14 (7-day window from the 2026-10-07 recording) OR 2026-10-14 passes without two HITs — the decision is a receipt, not a feeling"
