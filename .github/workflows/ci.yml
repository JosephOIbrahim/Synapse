name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    env:
      # Mapped from the secret so steps can gate on its presence — the `secrets`
      # context is not usable directly in `if:`. Empty string when the
      # MONETA_DEPLOY_KEY secret is not configured, in which case the Moneta
      # backend steps below skip and the ~70 Moneta-gated tests skip as before
      # (CI stays green). Add the secret to activate them. See docs/MONETA_FOLLOWUPS.md (FU-3).
      MONETA_DEPLOY_KEY: ${{ secrets.MONETA_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default depth-1 shallow clone.
          # tests/test_d_track.py anchors its quarantine diff against master and
          # fails "master ref unresolvable; fetch/create master before trusting
          # this guard" on a shallow checkout — so the guard was reporting an
          # environment gap on EVERY pull request, on every matrix leg, with
          # nothing wrong in the code under test. A guard that cannot resolve
          # its own baseline is not guarding.
          fetch-depth: 0

      - name: Give the git-anchored guards their master ref
        # CI0. A `pull_request` checkout is a DETACHED HEAD with no local
        # branches, so `master` does not resolve. fetch-depth: 0 above fetches
        # all history and the remote-tracking refs, but it creates no local
        # head — which is why the fix above only got half of this. Two guards
        # then report an ENVIRONMENT GAP instead of a verdict, on every single
        # pull request:
        #
        #   test_d_track.py::test_tops_path_untouched_green_at_head
        #     "cannot anchor the quarantine diff — master ref unresolvable;
        #      fetch/create master before trusting this guard"
        #     — its own message is the instruction being followed here.
        #
        #   test_perf_ratchet.py::test_anchor_resolves_via_origin_master_when_no_local_master
        #     builds its fixture with `git clone` of this repo. clone copies
        #     local heads, NOT remote-tracking refs, so with no local master the
        #     fixture clone has no origin/master and cannot be built. It fails
        #     at its own setup assertion rather than testing something false,
        #     which is the honest shape — it just needs a buildable fixture.
        #
        # Verified both directions on a detached, no-master checkout: those two
        # FAIL before this line and PASS after it. This provisions the ref the
        # guards document as their prerequisite. No assertion is touched.
        #
        # Conditional on purpose: a push to master has master checked out, and
        # `git branch -f` against the current branch is a hard error.
        run: git rev-parse --verify --quiet master >/dev/null || git branch master origin/master
        shell: bash

      - name: Check out private Moneta backend (when key is configured)
        if: ${{ env.MONETA_DEPLOY_KEY != '' }}
        uses: actions/checkout@v5
        with:
          repository: JosephOIbrahim/Moneta
          # PINNED (was `main`): tracking the branch tip made CI and every
          # developer workstation disagree about what "moneta" means on any
          # given day, and the ratchet suite baseline (harness/verify/
          # suite_baseline.json) is measured against it. CI pins a specific
          # tag independently of pyproject.toml's version range.
          ref: v1.2.0-rc3
          ssh-key: ${{ secrets.MONETA_DEPLOY_KEY }}
          path: _moneta

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - run: pip install -e ".[dev,websocket,mcp]"

      - name: Install Moneta backend (zero-dep, pxr-free; when key is configured)
        if: ${{ env.MONETA_DEPLOY_KEY != '' }}
        run: pip install -e ./_moneta

      - name: Assert Moneta backend is active (no silent skip)
        if: ${{ env.MONETA_DEPLOY_KEY != '' }}
        run: |
          python -c "import sys; from synapse.memory import moneta_runtime as m; ok = m.moneta_available(); print('Moneta available:', ok, '| import_error:', m.import_error()); sys.exit(0 if ok else 1)"

      # CI0. Stock GitHub runners have no Houdini and no OpenUSD, so modules
      # that cannot be collected or run without `hou`/`pxr` are deselected by
      # the `needs_houdini` marker (auto-applied in tests/conftest.py — see the
      # block at the bottom of that file for the rule and why it cannot hide a
      # failure: a module earns the marker only if it ALREADY skips itself
      # without its runtime).
      #
      # `-rs` prints every skip with its reason, and the conftest prints every
      # needs_houdini DESELECTION with the runtime it needs, so nothing leaves
      # this run silently. A green check here means: everything that can run on
      # a stock runner ran and passed, and everything that cannot is named in
      # the summary with a reason you can audit.
      #
      # Developers are unaffected: `pytest tests/` with no -m filter still
      # collects and runs the whole suite, which is what the receipts record.
      # See docs/CI_TWO_WORLDS.md.
      - run: python -m pytest tests/ -m "not needs_houdini" -v -rs --tb=short
