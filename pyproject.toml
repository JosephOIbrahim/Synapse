[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-houdini"
version = "5.97.7"
description = "AI copilot inside Houdini: chat in plain English and it builds in your live scene over a self-healing WebSocket bridge — undo-wrapped, provenance-recorded. Scene mutations are undo-wrapped and reversible. Filesystem and network effects of executed code are not."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Joseph Ibrahim", email = "joseph@josephibrahim.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
keywords = ["houdini", "vfx", "ai-copilot", "claude", "anthropic", "agent", "mcp", "websocket", "usd", "solaris", "kinefx", "apex", "materialx", "copernicus", "pdg", "rigging", "procedural", "memory", "provenance", "audit", "security", "resilience", "automation", "synapse", "gemini", "nvidia", "nemotron", "multi-provider", "openai-compatible", "ollama", "local-llm", "flywheel", "self-improving", "knowledge-grounding", "graph-validation", "node-recognition", "network-layout", "adversarial-testing", "seam-gate", "consent", "human-in-the-loop"]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # CI test deps (Linux runners). Without these, pytest tests/ fails:
    #  - pytest-asyncio: test_solaris_ordering async tests ("not natively supported")
    #  - numpy: test_frame_validator ("No module named 'numpy'")
    #  - anthropic: test_host_layer ("anthropic SDK is not installed") -- the
    #    vendored SDK is Windows-only binaries, unusable on the Linux CI runner.
    "pytest-asyncio>=0.21",
    "numpy>=1.24",
    # Pinned: the model-access guard (python/synapse/model_access.py) checks the
    # API key in the `x-api-key` header and refuses any request that carries
    # an `Authorization` header. anthropic 2.x moved the key to
    # `Authorization: Bearer <key>` and moved `anthropic-version` to
    # 2026-10-21, so under 2.x EVERY guarded request is denied with "The model
    # request changed after permission was checked." That is not a test
    # artifact: it is the shipped product refusing to talk to the model.
    # anthropic 2.3.0 landed on 2026-10-23 and turned 5 of the 6 CI jobs red
    # (all but windows/3.11, which still uses the vendored 0.96.0 SDK) - the
    # one job that stayed green was the one not using the pip-installed SDK.
    # Measured against the guard: 0.75.0 fails, 0.96.0 passes, 1.0.0 passes,
    # 1.15.0 passes, 2.3.0 fails. Relax the ceiling only after the guard
    # accepts the 2.x auth convention AND the panel is verified against the
    # 2026-10-21 wire protocol. See docs/tickets/ANTHROPIC_SDK_2X_MIGRATION.md.
    "anthropic>=1.0.0,<2",
    #  - pyyaml: test_agent_roster parses .claude/agents frontmatter with yaml.safe_load
    "pyyaml>=6.0",
]
websocket = [
    "websockets>=11.0",
]
encryption = [
    "cryptography>=41.0.0",
]
mcp = [
    # Pinned: mcp >=1.27 dropped Server.list_tools()/Server.call_tool() decorators,
    # which mcp_server.py:899 (@server.list_tools()) and the call_tool decorator
    # depend on. That drop turned master CI red (collection error at :899 + 2
    # tests) since 2026-07-29 while the local suite stayed green on 1.26.0.
    # 1.26.0 is verified to retain Server.list_tools (probed live). Relax only
    # after migrating mcp_server.py to the new decorator API. See CLEAR P3.2.
    "mcp==1.26.0",
    "websockets>=11.0",
]
routing = [
    # Same constraint as the `dev` extra, and for the same reason: this is the
    # extra the shipped product installs, so an unpinned SDK here is a product
    # that refuses every model call the moment the SDK ships a major. The
    # guard's reasoning and the measured support window are documented in the
    # `dev` extra above.
    "anthropic>=1.0.0,<2",
]
fast-hash = [
    "xxhash>=3.0.0",
]
memory = [
    "filelock>=3.12",
]
build = [
    "cython>=3.0",
    "setuptools>=61.0",
]
semantic = [
    # Query-time + offline-build dependency for scout's dense-retrieval path
    # (python/synapse/cognitive/tools/scout.py EMBEDDERS registry). Optional:
    # absent -> scout degrades to mode="lexical_only" (existing behavior,
    # unchanged). Not required on a clean H22 install; only needed wherever
    # the semantic index is (re)built or queried in hybrid mode.
    "sentence-transformers>=2.2",
]
moneta = [
    # Optional alternate memory backend (SYNAPSE_MEMORY_BACKEND=moneta|shadow).
    # Default backend is jsonl; without this extra, moneta is never imported and
    # SYNAPSE runs unchanged. Private repo (License: Proprietary, not on PyPI)
    # and Requires-Python >=3.11, so this extra only resolves with repo credentials
    # on 3.11+; on 3.9/3.10 pip correctly refuses it. Published v1.3.0 (stable)
    # reports distribution version 1.3.0. Pin its exact source commit:
    # the separately qualified moneta_native wheel is still required for Rust.
    "moneta @ git+https://github.com/JosephOIbrahim/Moneta.git@4f7afc73736aecce6d55d5e03f28fb3137d474d3",
]

[project.urls]
Homepage = "https://github.com/JosephOIbrahim/Synapse"
Repository = "https://github.com/JosephOIbrahim/Synapse"
Issues = "https://github.com/JosephOIbrahim/Synapse/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-dir]
"" = "python"

[tool.pytest.ini_options]
# SR1 M2: `synapse` is editable-installed pointing at the PRIMARY checkout
# (<primary-checkout>/python via a .pth). Without this, a git worktree's
# tests import the primary checkout's package and silently verify the wrong
# tree — Constitution Law 1, a check that cannot see what it claims to check.
# pytest prepends these to sys.path, so the local tree wins.
pythonpath = ["python"]
testpaths = ["tests", "harness/jev/tests", "harness/harness2/tests", "harness/attest/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "live: requires a running Houdini session with SYNAPSE WebSocket server (not collected by default in CI)",
    # CI0. Applied automatically by tests/conftest.py to modules that cannot be
    # collected or run without `hou` or `pxr`; CI filters with
    # `-m \"not needs_houdini\"`. Never hand-applied -- a module earns it only
    # by already refusing to run without its runtime, which is what makes the
    # filter incapable of hiding a failure. See the block at the bottom of
    # tests/conftest.py and tests/test_needs_houdini_marker.py.
    "needs_houdini: requires a Houdini runtime (hou) or OpenUSD (pxr); auto-applied, never hand-applied",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
exclude = [
    "tests/",
    "build/",
]
mypy_path = "python"

[[tool.mypy.overrides]]
module = "synapse.routing.router"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "synapse.server.websocket"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "synapse.server.hwebserver_adapter"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "synapse.server.api_adapter"
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = "hou"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hou.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "synapse.inspector.*"
strict = true

[tool.coverage.run]
source = ["python/synapse"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
